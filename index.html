<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fun projects</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:#0a0a0c;color:#8b8b93;
    font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:32px;
  }
  main{width:100%;max-width:520px}
  h1{margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#55555e;font-weight:600}
  .sub{margin:8px 0 34px;font-size:12.5px;color:#4a4a52}
  a.card{
    display:flex;gap:16px;align-items:center;
    text-decoration:none;color:inherit;
    padding:18px 20px;border:1px solid #1e1e26;border-radius:12px;
    background:#101014;transition:.18s;
  }
  a.card:hover{border-color:#3a1518;background:#14100f;transform:translateY(-2px)}
  a.card:hover .name{color:#ff5a4e}
  .icon{font-size:30px;line-height:1}
  .name{font-size:15px;color:#c9c9d1;font-weight:600;transition:.18s}
  .what{font-size:12.5px;color:#54545d;margin-top:3px}
  footer{margin-top:30px;font-size:11.5px;color:#3f3f47;text-align:center}
  footer a{color:#54545d}
</style>
</head>
<body>
<main>
  <h1>Fun projects</h1>
  <p class="sub">Small things built for the fun of building them.</p>

  <a class="card" href="blow-up/">
    <span class="icon">💥</span>
    <span>
      <span class="name">blow-up</span>
      <span class="what" style="display:block">A red button that deletes its own file.</span>
    </span>
  </a>

  <footer><a href="https://github.com/SharingEnd/Fun-projects">source on github</a></footer>
</main>
</body>
</html>
