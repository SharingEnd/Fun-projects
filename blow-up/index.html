<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOW UP</title>
<style>
  :root{
    --red:#e1121b;
    --red-hi:#ff3b3b;
    --red-lo:#7d0409;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#0a0a0c;
    color:#8b8b93;
    font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #wrap{position:fixed;inset:0;display:grid;place-items:center;will-change:transform}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  main{position:relative;text-align:center;padding:24px;z-index:2}

  .hint{margin:0 0 28px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#55555e}
  .fine{margin:32px auto 0;max-width:34ch;font-size:12px;color:#4a4a52}

  #boom{
    -webkit-appearance:none;appearance:none;
    display:block;margin:0 auto;
    width:min(62vw,260px);height:min(62vw,260px);
    border-radius:50%;
    border:none;
    cursor:pointer;
    font:inherit;font-size:clamp(22px,7vw,40px);font-weight:700;
    letter-spacing:.06em;
    color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.45);
    background:
      radial-gradient(circle at 34% 28%, #ff6b6b 0%, var(--red-hi) 22%, var(--red) 55%, var(--red-lo) 100%);
    box-shadow:
      0 0 0 10px #16161a,
      0 0 0 12px #23232a,
      0 26px 44px -18px rgba(225,18,27,.85),
      0 0 90px -10px rgba(225,18,27,.45),
      inset 0 -14px 26px rgba(0,0,0,.45),
      inset 0 12px 22px rgba(255,255,255,.22);
    transition:transform .09s ease, box-shadow .2s ease, filter .2s ease;
    animation:breathe 3.4s ease-in-out infinite;
  }
  #boom:hover{filter:brightness(1.08)}
  #boom:active{transform:scale(.955) translateY(3px)}
  #boom:focus-visible{outline:2px dashed #ff8b8b;outline-offset:16px}
  #boom[disabled]{cursor:default;animation:none}
  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 10px #16161a,0 0 0 12px #23232a,0 26px 44px -18px rgba(225,18,27,.85),0 0 90px -10px rgba(225,18,27,.45),inset 0 -14px 26px rgba(0,0,0,.45),inset 0 12px 22px rgba(255,255,255,.22)}
    50%{box-shadow:0 0 0 10px #16161a,0 0 0 12px #23232a,0 26px 44px -18px rgba(225,18,27,.95),0 0 130px 0 rgba(225,18,27,.6),inset 0 -14px 26px rgba(0,0,0,.45),inset 0 12px 22px rgba(255,255,255,.22)}
  }
  .fuse #boom{animation:jitter .07s linear infinite}
  @keyframes jitter{
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(2px,-2px) rotate(.6deg)}
    50%{transform:translate(-2px,1px) rotate(-.7deg)}
    75%{transform:translate(1px,2px) rotate(.4deg)}
    100%{transform:translate(0,0) rotate(0)}
  }

  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}

  /* ---- aftermath ---- */
  .grave{max-width:44ch;margin:0 auto;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .stone{font-size:64px;line-height:1;filter:grayscale(.2)}
  .grave h1{margin:18px 0 6px;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:#c9c9d1;font-weight:600}
  .grave .path{color:var(--red-hi);font-size:13px;word-break:break-all}
  .grave p{font-size:12.5px;color:#54545d;margin:14px 0 0}
  .grave code{color:#9b9ba3;background:#15151a;border:1px solid #22222a;border-radius:5px;padding:2px 6px;font-size:12px}
  .undo{
    margin-top:26px;background:none;border:1px solid #26262e;color:#5c5c66;
    font:inherit;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    padding:9px 16px;border-radius:999px;cursor:pointer;transition:.18s
  }
  .undo:hover{color:#c9c9d1;border-color:#43434f}
  .tag{display:inline-block;margin-bottom:18px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#5f2226;border:1px solid #3a1518;background:#170a0c;border-radius:999px;padding:4px 10px}
  @media (prefers-reduced-motion:reduce){
    #boom,.fuse #boom,.grave{animation:none!important}
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="fx"></canvas>
  <main id="stage">
    <p class="hint">this page has exactly one feature</p>
    <button id="boom" type="button">BLOW&nbsp;UP</button>
    <p class="fine">it deletes its own file. that's it. that's the whole app.</p>
  </main>
</div>
<div id="flash"></div>

<script>
'use strict';

const KEY   = 'blow-up:detonated';
const wrap  = document.getElementById('wrap');
const stage = document.getElementById('stage');
const btn   = document.getElementById('boom');
const flash = document.getElementById('flash');
const cv    = document.getElementById('fx');
const ctx   = cv.getContext('2d');

/* ---------------------------------------------------------------- canvas */
let dpr = 1;
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.floor(innerWidth  * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
addEventListener('resize', resize);

const bits = [];   // debris + embers + smoke
let shake = 0, ring = null, running = false;

function loop(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);

  // shockwave
  if (ring){
    ring.r += ring.v;
    ring.v *= 0.94;
    ring.a -= 0.018;
    if (ring.a <= 0) ring = null;
    else {
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,190,150,' + ring.a.toFixed(3) + ')';
      ctx.lineWidth = 2 + ring.a * 10;
      ctx.stroke();
    }
  }

  for (let i = bits.length - 1; i >= 0; i--){
    const p = bits[i];
    p.vy += p.g;
    p.vx *= p.d;
    p.vy *= p.d;
    p.x  += p.vx;
    p.y  += p.vy;
    p.rot += p.spin;
    p.life -= p.decay;
    if (p.life <= 0 || p.y > innerHeight + 120){ bits.splice(i, 1); continue; }

    const a = Math.max(0, Math.min(1, p.life));
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = a;
    if (p.kind === 'smoke'){
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a * 0.16;
      ctx.beginPath();
      ctx.arc(0, 0, p.s * (2.4 - a), 0, Math.PI * 2);
      ctx.fill();
    } else if (p.kind === 'ember'){
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.s, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * (p.kind === 'shard' ? 0.55 : 1));
    }
    ctx.restore();
  }

  if (shake > 0.2){
    shake *= 0.9;
    const k = shake;
    wrap.style.transform =
      'translate(' + (Math.random() * 2 - 1) * k + 'px,' + (Math.random() * 2 - 1) * k + 'px)';
  } else if (shake){
    shake = 0;
    wrap.style.transform = '';
  }

  if (bits.length || ring || shake) requestAnimationFrame(loop);
  else running = false;
}
function kick(){ if (!running){ running = true; requestAnimationFrame(loop); } }

const REDS = ['#ff5a4e', '#e1121b', '#ff9d3d', '#ffd166', '#ffffff', '#7d0409'];

function burst(x, y, r){
  ring = { x: x, y: y, r: r * 0.5, v: 26, a: 0.9 };
  shake = 26;

  for (let i = 0; i < 190; i++){
    const ang = Math.random() * Math.PI * 2;
    const sp  = (0.4 + Math.pow(Math.random(), 0.55)) * (7 + r * 0.11);
    const shard = Math.random() < 0.55;
    bits.push({
      kind: shard ? 'shard' : 'chunk',
      x: x + Math.cos(ang) * r * 0.42 * Math.random(),
      y: y + Math.sin(ang) * r * 0.42 * Math.random(),
      vx: Math.cos(ang) * sp,
      vy: Math.sin(ang) * sp - 3,
      g: 0.34, d: 0.985,
      s: 3 + Math.random() * (shard ? 16 : 9),
      rot: Math.random() * 6.28,
      spin: (Math.random() - 0.5) * 0.4,
      life: 1, decay: 0.006 + Math.random() * 0.008,
      color: REDS[(Math.random() * REDS.length) | 0]
    });
  }
  for (let i = 0; i < 70; i++){
    const ang = Math.random() * Math.PI * 2;
    const sp  = Math.random() * 16 + 3;
    bits.push({
      kind: 'ember',
      x: x, y: y,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 2,
      g: 0.11, d: 0.97,
      s: 1 + Math.random() * 2.6,
      rot: 0, spin: 0,
      life: 1, decay: 0.012 + Math.random() * 0.02,
      color: Math.random() < 0.5 ? '#ffd166' : '#ff7a3d'
    });
  }
  smoke(x, y, 26);
  kick();
}

function smoke(x, y, n){
  for (let i = 0; i < n; i++){
    bits.push({
      kind: 'smoke',
      x: x + (Math.random() - 0.5) * 90,
      y: y + (Math.random() - 0.5) * 60,
      vx: (Math.random() - 0.5) * 1.1,
      vy: -0.35 - Math.random() * 0.7,
      g: -0.004, d: 0.995,
      s: 22 + Math.random() * 46,
      rot: 0, spin: 0,
      life: 1, decay: 0.0022 + Math.random() * 0.003,
      color: '#8d8d99'
    });
  }
  kick();
}

/* ----------------------------------------------------------------- sound */
let ac = null;
function audio(){
  if (ac) return ac;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) ac = new AC();
  return ac;
}
function fuseSound(dur){
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(90, a.currentTime);
  o.frequency.exponentialRampToValueAtTime(760, a.currentTime + dur);
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.07, a.currentTime + dur * 0.9);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g).connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}
function boomSound(){
  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * 1.5);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++){
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
  }
  const src = a.createBufferSource(); src.buffer = buf;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass';
  lp.frequency.setValueAtTime(1400, a.currentTime);
  lp.frequency.exponentialRampToValueAtTime(90, a.currentTime + 1.2);
  const g = a.createGain(); g.gain.value = 0.5;
  src.connect(lp).connect(g).connect(a.destination);
  src.start();
}

/* ------------------------------------------------------------- aftermath */
function aftermath(mode, when){
  const real = mode === 'real';
  const stamp = new Date(when || Date.now());
  const time = stamp.toLocaleString();
  stage.innerHTML =
    '<div class="grave">' +
      '<span class="tag">' + (real ? 'file deleted' : 'sandboxed — file survived') + '</span>' +
      '<div class="stone">🕳️</div>' +
      '<h1>here lies</h1>' +
      '<div class="path">blow-up/index.html</div>' +
      '<p>' + (real
        ? 'Detonated ' + time + '. The server unlinked this file from disk. ' +
          'You are looking at the last copy of it, held in memory by your browser. ' +
          'Reload and there is nothing left to serve.'
        : 'Detonated ' + time + '. Opened without the server, so the browser sandbox ' +
          'would not let the page reach the disk — it settled for erasing itself instead, ' +
          'permanently. Run it with <code>node serve.js</code> for the real thing.') +
      '</p>' +
      '<button class="undo" type="button" id="undo">' + (real ? 'how do I get it back' : 'put it back') + '</button>' +
    '</div>';

  document.title = '🕳️ gone';
  const undo = document.getElementById('undo');
  undo.addEventListener('click', function(){
    if (real){
      try { localStorage.removeItem(KEY); } catch (e) {}
      undo.outerHTML =
        '<p style="margin-top:26px">Bring it back with <code>node serve.js --resurrect</code>' +
        ' or <code>git restore blow-up/index.html</code> \u2014 then reload, and the button' +
        ' is armed again.</p>';
    } else {
      try { localStorage.removeItem(KEY); } catch (e) {}
      location.reload();
    }
  });

  // the crater keeps smouldering
  const t = setInterval(function(){
    if (!document.body.contains(undo) && !document.querySelector('.grave')) return clearInterval(t);
    smoke(innerWidth / 2, innerHeight * 0.62, 2);
  }, 900);
}

/* --------------------------------------------------------------- the deed */
async function deleteMyself(){
  try {
    const res = await fetch('__detonate', { method: 'POST', headers: { 'x-detonate': '1' } });
    if (!res.ok) return false;
    const data = await res.json().catch(function(){ return null; });
    return !!(data && data.deleted);
  } catch (e) {
    return false;                       // file:// or static host — no server to ask
  }
}

let armed = true;
btn.addEventListener('click', function(){
  if (!armed) return;
  armed = false;
  btn.disabled = true;
  btn.textContent = '…';
  document.body.classList.add('fuse');
  document.title = '💥';

  const FUSE = 850;
  fuseSound(FUSE / 1000);

  const deleted = deleteMyself();      // fire the request during the fuse

  setTimeout(async function(){
    document.body.classList.remove('fuse');

    const r = btn.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    boomSound();
    burst(cx, cy, r.width);

    flash.style.transition = 'none';
    flash.style.opacity = '0.95';
    requestAnimationFrame(function(){
      flash.style.transition = 'opacity 620ms ease-out';
      flash.style.opacity = '0';
    });

    stage.style.transition = 'opacity 180ms ease-out';
    stage.style.opacity = '0';

    const mode = (await deleted) ? 'real' : 'sandbox';
    try { localStorage.setItem(KEY, JSON.stringify({ mode: mode, at: Date.now() })); } catch (e) {}

    setTimeout(function(){
      stage.style.opacity = '';
      aftermath(mode);
    }, 1400);
  }, FUSE);
});

/* Was it already blown up in this browser? Then it stays blown up --
   unless the file itself came back.

   A real deletion cannot serve this page: if you are reading these bytes
   over http, index.html exists on disk again, so somebody resurrected it
   and the stored detonation is stale. Drop it and re-arm. (Under file://
   there is no server to have deleted anything, so the sandbox crater is
   the whole point and it persists.) */
(function(){
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
  if (!prev) return;

  if (prev.mode === 'real' && location.protocol !== 'file:'){
    try { localStorage.removeItem(KEY); } catch (e) {}
    return;                                   // armed again
  }

  armed = false;
  aftermath(prev.mode, prev.at);
  smoke(innerWidth / 2, innerHeight * 0.62, 14);
})();
</script>
</body>
</html>
